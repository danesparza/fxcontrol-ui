name: Check and build UI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: make lint-new
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: fxcontrol-ui
          path: dist/
          if-no-files-found: error
